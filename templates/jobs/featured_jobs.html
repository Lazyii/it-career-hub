<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Việc làm nổi bật - IT Career Hub</title>

    <link rel="stylesheet" href="../css/jobs.css">
</head>
<body>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-content">

            <h1>Việc làm nổi bật</h1>
            <p>Việc làm từ những nhà tuyển dụng hàng đầu</p>

            <div class="search-box">

                <input
                    type="text"
                    placeholder="Kỹ năng..."
                >

                <input
                    type="text"
                    placeholder="Công việc cần tìm"
                >

            </div>

            <div class="filters">

                <select>
                    <option>Lĩnh vực</option>
                </select>

                <select>
                    <option>Mức lương</option>
                </select>

                <select>
                    <option>Cấp bậc</option>
                </select>

                <select>
                    <option>Hình thức</option>
                </select>

            </div>

        </div>
    </section>

    <!-- JOB LIST -->
    <main class="container">

        <div id="job-list"></div>

        <!-- PAGINATION -->
        <div class="pagination">
            <span class="active"></span>
            <span></span>
            <span></span>
        </div>

    </main>

    <!-- FOOTER -->
    <footer>

        <div class="footer-grid">

            <div>
                <h3>IT CAREER HUB</h3>
                <p>Nền tảng tuyển dụng IT chuyên nghiệp.</p>
                <p>© 2026 IT Career Hub</p>
            </div>

            <div>
                <h4>Ứng viên</h4>
                <ul>
                    <li>Tìm việc làm</li>
                    <li>Tạo CV</li>
                    <li>Ứng tuyển</li>
                </ul>
            </div>

            <div>
                <h4>Nhà tuyển dụng</h4>
                <ul>
                    <li>Đăng tuyển</li>
                    <li>Tìm ứng viên</li>
                </ul>
            </div>

            <div>
                <h4>Về chúng tôi</h4>
                <ul>
                    <li>Giới thiệu</li>
                    <li>Liên hệ</li>
                </ul>
            </div>

        </div>

    </footer>

    <script src="../js/jobs.js"></script>

</body>
</html>
